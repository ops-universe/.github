name: Reusable product Pages build
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate and validate static pages
        run: node site/build.mjs
      - name: Reject symlinks and missing index
        run: |
          test -d site/dist && test ! -L site/dist
          test -f site/dist/index.html
          test -z "$(find site/dist -type l -print -quit)"
          test -z "$(find site/dist -type f -links +1 -print -quit)"
          test -z "$(find site/dist ! -type f ! -type d -print -quit)"
      - name: Archive Pages output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tar --directory site/dist --exclude=.git --exclude=.github -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

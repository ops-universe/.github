name: Shared workflow CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download and verify actionlint 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --max-time 120 --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
